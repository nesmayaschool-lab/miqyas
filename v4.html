<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مِقياس ٤</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>

.ch{flex:1;padding:12px 4px;border-radius:12px;border:1px solid #2c3546;background:var(--pn);color:var(--ink);font:700 15px Tajawal}.ch.on{border-color:var(--gold);color:var(--gold)}
#go{flex:1.3;padding:14px 4px;border:0;border-radius:30px;background:#e5483d;color:#fff;font:700 19px Tajawal}
#msg{position:fixed;left:10px;right:66px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:4;display:none;background:#3a2a10;border:1px solid var(--gold);padding:9px;border-radius:10px;font-size:15px;line-height:1.6}

#pal i{width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:block}
#pal input{width:100%;height:34px;padding:0;border:0;background:none}
#st{position:fixed;inset:auto 10px 80px 10px;z-index:5;display:none;background:#141a28;border:1px solid var(--gold);border-radius:14px;padding:12px;gap:8px;max-height:70vh;overflow:auto}
#st label{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:8px}
#st input{width:90px;padding:7px;border-radius:8px;border:1px solid #2c3546;background:#0b0f17;color:var(--ink);font:700 16px Tajawal;text-align:center}
#st button{padding:11px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:700 15px Tajawal}

#start h1{font:700 60px Amiri,serif;margin:0;color:var(--gold)}#start p{max-width:320px;line-height:1.8;margin:0;color:#9aa3b2;font-size:16px}
#startBtn{padding:14px 44px;border:0;border-radius:30px;background:var(--gold);color:#241a05;font:700 18px Tajawal}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video><canvas id="ov"></canvas>
<div id="tb"></div><div id="pal"></div><div id="msg"></div>
<div id="st"><label>ارتفاع عينك (م)<input id="eh" type="number" step="0.01" value="1.6"></label><label>ارتفاع السقف (م)<input id="hc" type="number" step="0.01" value="2.8"></label><label>زاوية الرؤية (°)<input id="fv" type="number" value="55"></label><label>معامل التصحيح<input id="kk" type="number" step="0.001" value="1"></label><label>الطول الحقيقي للمعايرة (م)<input id="rl" type="number" step="0.01"></label><button id="cal">عايِر على آخر ضلع مرسوم</button><button id="wl">اضبط الجدار (ضع مركز الشاشة على قاعدته)</button><button id="zr">صفّر الميزان هنا</button><button id="cl">إغلاق</button></div>
<div id="bb"><button class="ch on" data-s="floor">أرض</button><button class="ch" data-s="ceil">سقف</button><button class="ch" data-s="wall">جدار</button><button id="go">قياس</button></div>
<div id="start"><h1>مِقياس</h1><p>الإصدار ٤ · ارسم أضلاعاً ونقاطاً ودوائر على الصورة، ثم اضغط الزر الأحمر لتظهر القيمة.</p><button id="startBtn">ابدأ</button></div>
