<div id="st"><label>ارتفاع عينك (م)<input id="eh" type="number" step="0.01" value="1.6"></label><label>زاوية الرؤية (°)<input id="fv" type="number" value="50"></label><label>معامل التصحيح<input id="kk" type="number" step="0.001" value="1"></label><label>الطول الحقيقي لضلع «مسافة» (م)<input id="rl" type="number" step="0.01"></label><button id="cal">عايِر المسافة على هذا الطول</button><button id="zr">صفّر الميزان هنا</button><button id="mt">🔊 الصوت: يعمل</button><p>مهم: قِس وأنت واقف في مكانك وحرّك الهاتف دوراناً فقط. الشكل مرتبط بالغرفة فيتحرك معها.</p><button id="cl">إغلاق</button></div>

<div id="start"><h1>أبعاد</h1><p>الإصدار ٨ · نمذجة الغرفة ثم قياس أي مكان: أرض، جدار، سقف، ارتفاعات، زوايا ثلاثية، مساحة، وعمق.</p><button id="startBtn">ابدأ (كل الهواتف)</button><a href="abaad2.html">هاتفك يدعم ARCore؟ افتح الواقع المعزز</a></div>
<script>
var PI=Math.PI,oa=0,ob=90,og=0,got=0,mute=0,ci=0,pw=4,ast=0,S=[],sel=-1,drag=null,res=null,resT=0,lvl=0,offX=0,offY=0,wasL=0,rec=null,last=0,chunks=[],pen=0,room=null,face='environment',fileMode=0,started=0,t0=0,tkT=0,
COLS=['#d8b45c','#e5483d','#2a9d8f','#4aa3ff','#ffffff','#b46cff','#ff8c3a'],AS=[[16,34,.22],[4,18,.6],[9,26,.4]];
var $=function(i){return document.getElementById(i)};
function f2(x){return Number(x).toLocaleString('ar-EG',{maximumFractionDigits:x<10?2:1})}
function num(i,d){var v=parseFloat($(i).value);return isNaN(v)?d:v}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function d3(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])}
function rgba(h,a){var n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function msg(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display='none'},7000)}
function speak(t){if(mute)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function sp1(x){return(Math.round(x*10)/10).toString().replace('.',' فاصل ')}
function basis(){var a=oa*PI/180,b=ob*PI/180,g=og*PI/180,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
return{X:[ca*cg-sa*sb*sg,sa*cg+ca*sb*sg,-cb*sg],Y:[-sa*cb,ca*cb,sb],F:[-(ca*sg+sa*sb*cg),-(sa*sg-ca*sb*cg),-cb*cg]}}
window.addEventListener('deviceorientation',function(e){if(e.beta==null)return;got=1;oa=e.alpha||0;ob=e.beta;og=e.gamma||0});
function focal(W,H){var V=$('cam'),vw=V.videoWidth||720,vh=V.videoHeight||1280;return(vw*Math.max(W/vw,H/vh)/2)/Math.tan(num('fv',50)*PI/360)}
function ray(px,py,W,H,B,f){var u=(px-W/2)/f,v=-(py-H/2)/f,d=[B.F[0]+B.X[0]*u+B.Y[0]*v,B.F[1]+B.X[1]*u+B.Y[1]*v,B.F[2]+B.X[2]*u+B.Y[2]*v],n=Math.hypot(d[0],d[1],d[2]);return[d[0]/n,d[1]/n,d[2]/n]}
function env(){var W=cvs.clientWidth,H=cvs.clientHeight;return{W:W,H:H,B:basis(),f:focal(W,H)}}
function RY(q,E){return ray(q[0],q[1],E.W,E.H,E.B,E.f)}
/* نموذج الغرفة: أرض + سقف + أربعة جدران */
function hit3(d){var h=num('eh',1.6),b=null,t,i;if(d[2]<-.001){b=h/-d[2]}
if(room){if(d[2]>.001){t=(room.H-h)/d[2];if(t>0&&(b==null||t<b))b=t}
for(i=0;i<4;i++){var A=room.C[i],B=room.C[(i+1)%4],nx=-(B[1]-A[1]),ny=B[0]-A[0],l=Math.hypot(nx,ny);nx/=l;ny/=l;var dn=nx*d[0]+ny*d[1];if(Math.abs(dn)>1e-6){t=(nx*A[0]+ny*A[1])/dn;if(t>0&&(b==null||t<b))b=t}}}
return b==null?null:[b*d[0],b*d[1],h+b*d[2]]}
function pj(P,E){var d=[P[0],P[1],P[2]-num('eh',1.6)],z=dot(d,E.B.F);if(z<.05)return null;return[E.W/2+E.f*dot(d,E.B.X)/z,E.H/2-E.f*dot(d,E.B.Y)/z]}
function scr(sh,E){if(sh.P)return sh.P.map(function(P){return pj(P,E)});return sh.p.map(function(q){return[q[0]*E.W,q[1]*E.W]})}
function sd(p,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function rdp(p,e){if(p.length<3)return p;var a=p[0],b=p[p.length-1],m=0,k=0,i;for(i=1;i<p.length-1;i++){var d=sd(p[i],a,b);if(d>m){m=d;k=i}}return m>e?rdp(p.slice(0,k+1),e).slice(0,-1).concat(rdp(p.slice(k),e)):[a,b]}
function angv(a,b){var n=Math.hypot(a[0],a[1],a[2])*Math.hypot(b[0],b[1],b[2]);return n?Math.acos(Math.max(-1,Math.min(1,dot(a,b)/n)))*180/PI:0}
function areaP(P){var n=P.length,s=[0,0,0],pr=0,i;for(i=0;i<n;i++){var p=P[i],q=P[(i+1)%n];s[0]+=p[1]*q[2]-p[2]*q[1];s[1]+=p[2]*q[0]-p[0]*q[2];s[2]+=p[0]*q[1]-p[1]*q[0];pr+=d3(p,q)}return[Math.hypot(s[0],s[1],s[2])/2,pr]}
function ptsOf(sh,E){if(sh.P)return sh.P;var q=sh.p.map(function(a){return[a[0]*E.W,a[1]*E.W]});
if(sh.t==='pen')q=rdp(q,14);else if(/^(line|arrow|div|circle)$/.test(sh.t))q=q.slice(0,2);else return null;
var P=q.map(function(a){return hit3(RY(a,E))});return P.every(Boolean)?P:null}
function meas(sh,E){var K=num('kk',1),t=sh.t,P=ptsOf(sh,E);if(!P||!P.length)return null;var n=P.length,a,b;
if(t==='hgt')return{k:'الارتفاع عن الأرض',v:P[0][2]*K,u:'م'};
if(t==='dep')return{k:'العمق',v:(P[0][2]-P[1][2])*K,u:'م'};
if(t==='tri'){var X=sub(P[1],P[0]),Y=sub(P[2],P[0]),Z=sub(P[3],P[0]);return{k:'الزاوية بين الجدارين (س–ص)',v:angv(X,Y),u:'درجة',sub:'ص–ع '+f2(angv(Y,Z))+'° · س–ع '+f2(angv(X,Z))+'°'}}
if(t==='area'||(t==='pen'&&n>3)){a=areaP(P);return{k:'المساحة',v:a[0]*K*K,u:'م²',sub:'المحيط '+f2(a[1]*K)+' م'}}
if(t==='pen'&&n===3)return{k:'الزاوية',v:angv(sub(P[0],P[1]),sub(P[2],P[1])),u:'درجة'};
if(t==='circle'){var r=d3(P[0],P[1])*K;return{k:'نصف القطر',v:r,u:'م',sub:'القطر '+f2(2*r)+' م'}}
if(n>=2){a=P[0];b=P[n-1];return{k:'المسافة',v:d3(a,b)*K,u:'م',sub:'أفقياً '+f2(Math.hypot(a[0]-b[0],a[1]-b[1])*K)+' · رأسياً '+f2(Math.abs(a[2]-b[2])*K)}}return null}
function fixRoom(sh,E){var C=[],h=num('eh',1.6),i;for(i=0;i<4;i++){var d=RY([sh.p[i][0]*E.W,sh.p[i][1]*E.W],E);if(d[2]>-.02)return'ضع الأركان الأربعة على الأرض عند أسفل الجدران (تحت خط الأفق).';var t=h/-d[2];C.push([t*d[0],t*d[1],0])}
var d4=RY([sh.p[4][0]*E.W,sh.p[4][1]*E.W],E),A=C[0],t4=(d4[0]*A[0]+d4[1]*A[1])/(d4[0]*d4[0]+d4[1]*d4[1]||1),H=h+t4*d4[2];
if(!(H>1.2&&H<9))return'ضع المقبض العلوي على ملتقى السقف بالجدار فوق الركن الأول مباشرةً.';room={C:C,H:H};S=S.filter(function(s){return s!==sh});sel=-1;return roomRes()}
function roomRes(){var a=areaP(room.C),K=num('kk',1);return{k:'مساحة الغرفة',v:a[0]*K*K,u:'م²',sub:'ارتفاع '+f2(room.H*K)+' م · حجم '+f2(a[0]*room.H*K*K*K)+' م³'}}
/* الرسم */
function ln(x,a,b,c,w){x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=w+3;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
function head(x,a,b,c,s){var an=Math.atan2(b[1]-a[1],b[0]-a[0]);x.fillStyle=c;x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(b[0]-s*Math.cos(an-.4),b[1]-s*Math.sin(an-.4));x.lineTo(b[0]-s*Math.cos(an+.4),b[1]-s*Math.sin(an+.4));x.closePath();x.fill()}
function pill(x,t,cx,cy,col){x.font='800 28px Tajawal,sans-serif';x.direction='rtl';var w=x.measureText(t).width+30;x.fillStyle='rgba(16,21,31,.93)';x.fillRect(cx-w/2,cy-26,w,52);x.strokeStyle=col||'#d8b45c';x.lineWidth=2;x.strokeRect(cx-w/2,cy-26,w,52);x.fillStyle='#f3ead7';x.textAlign='center';x.textBaseline='middle';x.fillText(t,cx,cy);x.textBaseline='alphabetic'}
function hd(x,p,c){x.fillStyle='#fff';x.strokeStyle=c;x.lineWidth=4;x.beginPath();x.arc(p[0],p[1],21,0,7);x.fill();x.stroke()}
function drawRoom(x,E){var h=room.H,C=room.C,b=C.map(function(c){return pj(c,E)}),t=C.map(function(c){return pj([c[0],c[1],h],E)});
for(var i=0;i<4;i++){var j=(i+1)%4;if(b[i]&&b[j])ln(x,b[i],b[j],'#2a9d8f',3);if(t[i]&&t[j])ln(x,t[i],t[j],'#2a9d8f',3);if(b[i]&&t[i])ln(x,b[i],t[i],'rgba(42,157,143,.75)',3);if(b[i]&&b[j])pill(x,f2(d3(C[i],C[j]))+' م',(b[i][0]+b[j][0])/2,(b[i][1]+b[j][1])/2,'#2a9d8f')}}
function drawS(x,sh,E,i,ui){var p=scr(sh,E),c=sh.c,t=sh.t,w=sh.w||4,ax=null,m,k;if(p.some(function(q){return!q}))return;
function poly(a,fl){x.beginPath();a.forEach(function(q,j){j?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.closePath();x.fillStyle=rgba(c,fl);x.fill();x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=w+3;x.stroke();x.strokeStyle=c;x.lineWidth=w;x.stroke()}
function ell(cx,cy,rx,ry){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=w+3;x.stroke();x.strokeStyle=c;x.lineWidth=w;x.stroke()}
if(t==='pt'){x.fillStyle=c;x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.arc(p[0][0],p[0][1],11,0,7);x.fill();x.stroke()}
else if(t==='hgt'){var g=pj([sh.P[0][0],sh.P[0][1],0],E);if(g)ln(x,p[0],g,c,3);x.fillStyle=c;x.beginPath();x.arc(p[0][0],p[0][1],11,0,7);x.fill();ax=[p[0][0],p[0][1]-40]}
else if(t==='pen'){x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=w+3;x.lineJoin='round';x.beginPath();p.forEach(function(q,j){j?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.stroke();x.strokeStyle=c;x.lineWidth=w;x.stroke()}
else if(t==='circle'){var r=Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]);x.beginPath();x.arc(p[0][0],p[0][1],r,0,7);x.fillStyle=rgba(c,.12);x.fill();ell(p[0][0],p[0][1],r,r)}
else if(t==='cyl'){var r2=Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]);ell(p[0][0],p[0][1],r2,r2*.35);ell(p[2][0],p[2][1],r2,r2*.35);ln(x,[p[0][0]-r2,p[0][1]],[p[2][0]-r2,p[2][1]],c,w);ln(x,[p[0][0]+r2,p[0][1]],[p[2][0]+r2,p[2][1]],c,w)}
else if(t==='band'){poly(p,.16);var cx0=(p[0][0]+p[1][0]+p[2][0]+p[3][0])/4,cy0=(p[0][1]+p[1][1]+p[2][1]+p[3][1])/4;pill(x,'داخل',cx0,cy0,c);[[p[0],p[1]],[p[3],p[2]]].forEach(function(e,j){var mx=(e[0][0]+e[1][0])/2,my=(e[0][1]+e[1][1])/2,dx=mx-cx0,dy=my-cy0,n=Math.hypot(dx,dy)||1;pill(x,j?'بعد':'قبل',mx+dx/n*60,my+dy/n*60,c)})}
else if(t==='area'){poly(p,.22);ax=[p.reduce(function(s,q){return s+q[0]},0)/p.length,p.reduce(function(s,q){return s+q[1]},0)/p.length]}
else if(t==='room'){poly(p.slice(0,4),.12);ln(x,p[0],p[4],c,3);pill(x,'السقف',p[4][0],p[4][1]-40,c);ax=null}
else if(t==='tri'){var cs=['#e5483d','#2ecc71','#4aa3ff'],nm=['س','ص','ع'];for(k=1;k<4;k++){ln(x,p[0],p[k],cs[k-1],6);x.fillStyle=cs[k-1];x.font='800 32px Tajawal,sans-serif';x.textAlign='center';x.direction='rtl';x.fillText(nm[k-1],p[k][0]+(p[k][0]>p[0][0]?32:-32),p[k][1]+(p[k][1]>p[0][1]?38:-16))}ax=[p[0][0],p[0][1]+54]}
else{ln(x,p[0],p[1],c,w);if(t==='arrow')head(x,p[0],p[1],c,sh.hs||22);ax=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2-34];
