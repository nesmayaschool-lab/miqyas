<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>

</head>
<body>
<video id="cam" autoplay playsinline muted></video><canvas id="ov"></canvas>
<div id="top"><button class="k on" id="sR"><b>📷</b>خلفية</button><button class="k" id="sF"><b>🤳</b>أمامية</button><label class="k" id="sV"><b>🎞</b>فيديو<input type="file" accept="video/*" id="vin" hidden></label><button class="k" id="rec"><b>⏺</b>تسجيل</button><button class="k" id="bst"><b>⚙</b>ضبط</button></div>
<div id="side"></div><div id="pal"></div><div id="msg"></div><button id="go">اعرض<br>القيمة</button>
<div id="st"><label>ارتفاع عينك (م)<input id="eh" type="number" step="0.01" value="1.6"></label><label>زاوية الرؤية (°)<input id="fv" type="number" value="50"></label><label>معامل التصحيح<input id="kk" type="number" step="0.001" value="1"></label><label>عرض الشاشة بالمتر<input id="mw" type="number" step="0.001" value="0"></label>
<p><b>طريقة القياس:</b> «بالحساس» تقيس على الأرض (مسافات المساحة والغرف). «بمرجع» تقيس على سطح أمامك مواجه للكاميرا (جدار، ورقة، فيديو مسجل) وتحتاج معايرة.</p>
<div style="display:flex;gap:8px"><button style="flex:1" id="eS" class="on">بالحساس (أرض)</button><button style="flex:1" id="eR">بمرجع (سطح أمامي)</button></div>
<label>الطول الحقيقي لجسم معروف (م)<input id="rl" type="number" step="0.01"></label><button id="cal">عايِر على الضلع المحدد</button><button id="cf">اضبط زاوية الرؤية على ركن قائم (٩٠°)</button><button id="zr">صفّر الميزان هنا</button><button id="mt">🔊 الصوت: يعمل</button><button id="cl">إغلاق</button></div>
<div id="bot"><button class="k" data-m="dist"><b>📏</b>مسافة</button><button class="k" data-m="tri"><b>⌐</b>ركن 3D</button><button class="k" data-m="area"><b>⬡</b>مساحة</button><button class="k" data-m="circle"><b>◯</b>دائرة</button><button class="k" id="lv"><b>⚖</b>ميزان</button></div>
<div id="start"><h1>مِقياس</h1><p>الإصدار ٧ · «ركن 3D»: ثلاثة أضلاع س ص ع تضعها على جدارين وحافة رأسية، فتظهر الزاوية الحقيقية بين الجدارين.</p><button id="startBtn">ابدأ</button></div>
<script>

/* الرسم */

if(t==='pt'){x.fillStyle=c;x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.arc(p[0][0],p[0][1],11,0,7);x.fill();x.stroke()}

var cv=document.createElement('canvas'),cx=cv.getContext('2d'),RS=1.25,cvs=$('ov');
