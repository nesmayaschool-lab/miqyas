<html lang="ar" dir="rtl">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>

.tabs button.on{border-color:var(--gold);color:var(--gold)}

.tools{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;justify-content:space-between;padding:6px;z-index:2}
.fab{background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-radius:18px;padding:6px 10px;font:700 12px Tajawal}
#rec.on{background:#b3261e;border-color:#b3261e}
#msg{position:absolute;bottom:24px;left:8px;right:8px;z-index:3;display:none;background:#3a2a10;border:1px solid var(--gold);padding:8px;border-radius:10px;font-size:13px;line-height:1.7}
.panel{background:var(--panel);padding:8px 10px;display:grid;gap:7px;max-height:48vh;overflow-y:auto}
.panel p{margin:0;font-size:12.5px;line-height:1.6;color:var(--dim)}
.row{display:flex;gap:6px;align-items:center}
.row label{font-size:13px;color:var(--dim);flex:1}
input{width:80px;padding:6px;border-radius:8px;border:1px solid #2c3546;background:#0b0f17;color:var(--ink);font:700 15px Tajawal;text-align:center}
.btns{display:flex;gap:6px}
.go,.sm{flex:1;padding:11px 6px;border:0;border-radius:11px;background:var(--gold);color:#241a05;font:700 15px Tajawal}
.go.alt,.sm.alt{background:var(--teal);color:#fff}.go:disabled{opacity:.4}
.sm{padding:8px 4px;font-size:13px;background:#232c3d;color:var(--ink);border:1px solid #2c3546}.sm.on{border-color:var(--gold);color:var(--gold)}
.chip{min-width:40px;padding:7px 10px;border-radius:20px;border:1px solid #2c3546;background:#232c3d;color:var(--ink);font:700 15px Tajawal}.chip.on{background:var(--teal);border-color:var(--teal)}
#chips{display:flex;gap:6px;flex-wrap:wrap;min-height:10px}
#start{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
#start h1{font:700 60px Amiri,serif;margin:0;color:var(--gold)}
#start p{max-width:320px;color:var(--dim);line-height:1.8;margin:0}
</style>
</head>
<body>
<div class="tabs" id="tabs"><button data-m="dist" class="on">المسافة</button><button data-m="pts">نقاط وأشكال</button><button data-m="level">ميزان واستواء</button><button data-m="height">الارتفاع</button><button data-m="angle">الزاوية</button><button data-m="depth">العمق</button></div>
<div id="view"><video id="cam" autoplay playsinline muted></video><canvas id="ov"></canvas>
<div class="tools"><button class="fab" id="rec">● تسجيل فيديو</button><button class="fab" id="mt">🔊 الصوت</button><label class="fab">🎞 فيديو من الهاتف<input type="file" accept="video/*" capture="environment" id="vin" hidden></label></div><div id="msg"></div></div>
<div class="panel" id="panel"></div>
<div id="start"><h1>مِقياس</h1><p>الإصدار ٣ · قياس حيّ، نقاط مسمّاة (أ ب ج د)، محاذاة واستواء، وأوامر صوتية.</p><button class="go" id="startBtn" style="flex:none;padding:14px 40px">ابدأ</button></div>
<script>

if(mode==='pts'){var L=locked,sl=L&&L.s||[];
if(L&&L.t==='area'){var ps=sl.map(function(i){return pj(P[i])});if(ps.every(Boolean)){x.fillStyle='rgba(42,157,143,.3)';x.beginPath();ps.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.closePath();x.fill();x.strokeStyle='#2a9d8f';x.lineWidth=3;x.stroke()}}

P.forEach(function(p,i){var q=pj(p);if(!q)return;var on=sl.indexOf(i)>=0||sel.indexOf(i)>=0,sub='',col=on?'#2a9d8f':'#d8b45c';

/* التشغيل */
async function start(){try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}

if(!window.MediaRecorder||!cv.captureStream){msg('التسجيل غير مدعوم في هذا المتصفح.');return}
mt=['video/mp4','video/webm;codecs=vp9','video/webm'].filter(function(t){return MediaRecorder.isTypeSupported(t)})[0]||'';ext=/mp4/.test(mt)?'mp4':'webm';
var vw=$('view');cv.width=vw.clientWidth*2;cv.height=vw.clientHeight*2;chunks=[];rec=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt}:{});
rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
rec.onstop=function(){b.classList.remove('on');b.textContent='● تسجيل فيديو';rec=null;if(!chunks.length)return;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mt||'video/webm'}));a.download='qiyas.'+ext;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000);msg('تم حفظ الفيديو في التنزيلات.')};
rec.start(1000);b.classList.add('on');b.textContent='■ إيقاف وحفظ'};
/* الصوت: التعرّف على الأوامر */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,LM={'ا':0,'أ':0,'الف':0,'ألف':0,'ب':1,'باء':1,'با':1,'ج':2,'جيم':2,'د':3,'دال':3,'ه':4,'هـ':4,'هاء':4,'واو':5,'ز':6,'زاي':6,'ح':7,'حاء':7};
function letters(t){var o=[];t.replace(/[\u064B-\u0652ـ]/g,'').split(/[^\u0621-\u064Aa-z]+/i).forEach(function(w){if(!w||w==='و')return;var k=w in LM?w:(w[0]==='و'&&w.slice(1) in LM?w.slice(1):null);if(k!==null&&LM[k]<P.length&&o.indexOf(LM[k])<0)o.push(LM[k])});return o}
function voice(){if(!SR){msg('التعرّف الصوتي غير مدعوم في هذا المتصفح.');return}var r=new SR();r.lang='ar-SA';r.onresult=function(e){var t=e.results[0][0].transcript;msg('سمعتُ: '+t);runCmd(t)};r.onerror=function(){msg('لم أسمعك. حاول مرة أخرى.')};r.start();msg('🎤 تحدّث الآن: «المسافة بين أ وب» أو «مساحة أ ب ج د»')}
function runCmd(t){var l=letters(t);locked=null;
if(/امسح|احذف|مسح/.test(t)){P=[];sel=[];chips();return}
if(/استواء|استوا|محاذا|مستوي|افقي|أفقي/.test(t)){sel=l;chips();act('align');return}
if(/مساحة|مساحه/.test(t)){sel=l;chips();act('area');return}
if(/مسافة|مسافه|بين|بعد/.test(t)){sel=l.slice(0,2);chips();act('dist');return}
if(/نقطة|نقطه|اضف|أضف|سجل|ثبت/.test(t)){addPt();return}
if(l.length>=3){sel=l;chips();act('area')}else if(l.length===2){sel=l;chips();act('dist')}else msg('لم أفهم الأمر. قل مثلاً: المسافة بين أ وب.')}
function addPt(){if(locked)locked=null;var q=planePt(surf);if(!q){msg(surf==='wall'&&!wallN?'اضبط الجدار أولاً.':'وجّه المركز نحو السطح.');return}if(P.length>=8){msg('الحد الأقصى ٨ نقاط.');return}P.push(q);speak('النقطة '+LB[P.length-1]);chips()}
function chips(){var c=$('chips');if(!c)return;c.innerHTML=P.map(function(_,i){return'<button class="chip'+(sel.indexOf(i)>=0?' on':'')+'" data-i="'+i+'">'+LB[i]+'</button>'}).join('');c.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){var i=+b.dataset.i,k=sel.indexOf(i);k>=0?sel.splice(k,1):sel.push(i);locked=null;chips()}})}
function lockSimple(){if(locked){locked=null;render();return}var r=calc();if(!r.valid){msg(r.hint||'لا يوجد قياس.');return}locked=r;speak(r.k+' '+sp1(r.v)+' '+r.u);var g=$('go');if(g)g.textContent='قياس جديد'}
function render(){var p=$('panel');locked=null;
if(mode==='dist'){p.innerHTML='<p>وجّه المركز نحو نقطة على الأرض فيتغير الرقم مع حركتك والسهم يصل الكاميرا بالنقطة. اضغط للتثبيت.</p><div class="row"><label>ارتفاع عينك عن الأرض (م)</label><input id="eh" type="number" step="0.01" value="1.6"></div><div class="btns"><button class="go" id="go">ثبّت القياس</button></div>';$('go').onclick=lockSimple}
if(mode==='pts'){p.innerHTML='<p>قف ثابتاً وحرّك الهاتف فقط. ثبّت نقاطاً (أ ب ج…) ثم اختر منها للقياس، أو قل أمراً صوتياً.</p><div class="btns"><button class="sm" id="sf">على الأرض</button><button class="sm" id="sw">على جدار</button><button class="sm alt" id="wl">اضبط الجدار</button></div><div class="row"><label>ارتفاع عينك (م)</label><input id="eh" type="number" step="0.01" value="1.6"><label>تسامح المحاذاة (مم)</label><input id="tol" type="number" value="5"></div><div class="btns"><button class="go alt" id="add">＋ نقطة</button><button class="go" id="vc">🎤 أمر صوتي</button></div><div id="chips"></div><div class="btns"><button class="sm" id="b1">📏 مسافة</button><button class="sm" id="b2">⬛ مساحة</button><button class="sm" id="b3">〰 محاذاة</button><button class="sm" id="b4">مسح</button></div>';
var us=function(){$('sf').classList.toggle('on',surf==='floor');$('sw').classList.toggle('on',surf==='wall')};us();
$('sf').onclick=function(){surf='floor';us()};$('sw').onclick=function(){surf='wall';us();if(!wallN)msg('اضبط الجدار: وجّه المركز إلى أسفل الجدار قبالتك مباشرة واضغط «اضبط الجدار».')};
$('wl').onclick=function(){var q=planePt('floor');if(!q){msg('وجّه المركز نحو أسفل الجدار (عند التقائه بالأرض).');return}wallD=Math.hypot(q[0],q[1]);wallN=[q[0]/wallD,q[1]/wallD,0];surf='wall';us();msg('الجدار على بعد '+fmt(wallD)+' م. قف قبالته مباشرة وثبّت نقاطك عليه.');speak('تم ضبط الجدار')};
$('add').onclick=addPt;$('vc').onclick=voice;$('b1').onclick=function(){act('dist')};$('b2').onclick=function(){act('area')};$('b3').onclick=function(){act('align')};$('b4').onclick=function(){P=[];sel=[];locked=null;chips()};chips()}
if(mode==='height'){p.innerHTML='<p>اكتب المسافة الأفقية إلى الشيء (مثلاً 100 م للطائرة)، ثم وجّه المركز إلى أعلى نقطة، فيظهر الارتفاع حيّاً.</p><div class="row"><label>المسافة الأفقية (م)</label><input id="dd" type="number" placeholder="100"></div><div class="row"><label>ارتفاع عينك (م)</label><input id="eh2" type="number" step="0.01" value="1.6"></div><div class="btns"><button class="go" id="go">ثبّت القياس</button></div>';$('go').onclick=lockSimple}
if(mode==='angle'){p.innerHTML='<p>وجّه المركز إلى الجسم الأول واضغط، ثم حرّك نحو الثاني. الزاوية بينهما حيّة والسهم يربط الاتجاهين.</p><div class="btns"><button class="go" id="go">سجّل الاتجاه الأول</button></div>';
$('go').onclick=function(){if(locked){step=0;vA=null;render();return}if(step===0){vA=basis().F;step=1;$('go').textContent='ثبّت الزاوية';speak('تم تسجيل الاتجاه الأول');return}lockSimple()}}
if(mode==='level'){p.innerHTML='<p>ضع الهاتف على السطح المراد فحصه. الفقاعة تتجه نحو الجانب الأعلى، وينطق «مستوٍ» عندما يقل الميل عن ٠٫٣ درجة. لأفضل دقة: صفّر على سطح، ثم دوّر الهاتف ١٨٠° وأعد الفحص.</p><div class="btns"><button class="sm on" id="hz">سطح أفقي (الهاتف مسطّح)</button><button class="sm" id="vt">جدار رأسي (الهاتف واقف)</button></div><div class="btns"><button class="go alt" id="zr">صفّر هنا</button><button class="go" id="go">ثبّت القراءة</button></div>';
var uv=function(){$('hz').classList.toggle('on',!vert);$('vt').classList.toggle('on',vert)};
$('hz').onclick=function(){vert=false;offX=offY=0;uv()};$('vt').onclick=function(){vert=true;offX=offY=0;uv()};$('zr').onclick=function(){offX=og;offY=ob-(vert?90:0);msg('تم التصفير على هذا السطح.')};$('go').onclick=lockSimple}
if(mode==='depth'){p.innerHTML='<p>قف عند حافة البئر. اضغط «أفلتّ» مع إفلات الحجر، ثم «سمعت الصدى» عند سماع الارتطام.</p><div class="btns"><button class="go alt" id="g1">أفلتّ الحجر</button><button class="go" id="g2" disabled>سمعت الصدى</button></div>';
$('g1').onclick=function(){if(locked){render();return}t0=performance.now();timing=true;$('g1').disabled=true;$('g2').disabled=false};
$('g2').onclick=function(){var t=(performance.now()-t0)/1000,k=Math.sqrt(2/9.81),s=(-k+Math.sqrt(k*k+4*t/340))/(2/340);timing=false;locked={valid:true,k:'عمق البئر',v:s*s,u:'م',sub:'زمن السقوط '+t.toFixed(2)+' ث'};speak('عمق البئر '+sp1(s*s)+' متر');$('g2').disabled=true;$('g1').disabled=false;$('g1').textContent='قياس جديد'}}}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');mode=b.dataset.m;step=0;vA=null;timing=false;render()}});
render();frame();
</script>
