<script>

function hit3(d){var h=num('eh',1.6),b=null,t,i;if(d[2]<-.001){b=h/-d[2]}

function scr(sh,E){if(sh.R)return sh.R.map(function(d){return pr(d,E)});return sh.p.map(function(q){return[q[0]*E.W,q[1]*E.W]})}

function areaP(P){var n=P.length,s=[0,0,0],pr=0,i;for(i=0;i<n;i++){var p=P[i],q=P[(i+1)%n];s[0]+=p[1]*q[2]-p[2]*q[1];s[1]+=p[2]*q[0]-p[0]*q[2];s[2]+=p[0]*q[1]-p[1]*q[0];pr+=d3(p,q)}return[Math.hypot(s[0],s[1],s[2])/2,pr]}
function boxGeo(sh){var h=num('eh',1.6),B=[],i,d,t;for(i=0;i<4;i++){d=sh.R[i];if(d[2]>-.02)return null;t=h/-d[2];B.push([t*d[0],t*d[1],0])}d=sh.R[4];var A=B[0],t4=(d[0]*A[0]+d[1]*A[1])/(d[0]*d[0]+d[1]*d[1]||1),H=h+t4*d[2];H=Math.max(.05,Math.min(12,H||.5));return{B:B,H:H}}
