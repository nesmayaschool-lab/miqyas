<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبعاد · قياسات ثلاثية الأبعاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#f3ead7;--gold:#d8b45c;--teal:#2a9d8f;--pn:rgba(16,21,31,.9);color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#10151f;color:var(--ink);font-family:Tajawal,system-ui,sans-serif;overflow:hidden}
#ui{display:none;position:fixed;inset:0;pointer-events:none;font-family:Tajawal,sans-serif}
body.ar #ui{display:block}body.ar #intro{display:none}
#ui button{pointer-events:auto}
.k{border:1px solid #2c3546;background:var(--pn);color:var(--ink);border-radius:14px;font:800 20px Tajawal;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px}
.k b{font-size:28px;font-weight:400;line-height:1.1}.k.on{border-color:var(--gold);color:var(--gold);background:rgba(216,180,92,.2)}
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;right:6px;display:flex;gap:6px;height:76px}#top .k{flex:1}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 90px);left:50%;transform:translateX(-50%);width:min(92vw,440px);background:rgba(20,26,40,.94);border:2px solid var(--gold);outline:1px solid rgba(216,180,92,.4);outline-offset:-7px;padding:12px;text-align:center}
#hk{font:800 22px Tajawal;color:var(--gold)}#hv{font:700 54px Amiri,serif;direction:ltr;line-height:1.15}#hu{font:700 28px Amiri,serif;color:var(--teal);margin-inline-start:8px}#hs{font:400 19px Tajawal;color:#c4ccd8;margin-top:2px}
#modes{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);display:flex;gap:6px;padding:0 6px;overflow-x:auto;pointer-events:auto}#modes .k{flex:none;height:72px;min-width:100px;font-size:22px}
#add,#well{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:86px;display:flex;gap:8px}
#add button,#well button{flex:1;border:0;border-radius:44px;font:800 28px Tajawal;background:var(--gold);color:#241a05}#well{display:none}#well button+button{background:var(--teal);color:#fff}
#fl{display:none;position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 262px);gap:8px;align-items:center;background:var(--pn);padding:8px;border-radius:12px;font-size:19px}#fl input,#fl button{pointer-events:auto}#fl input{width:90px;padding:10px;border-radius:10px;border:1px solid #2c3546;background:#0b0f17;color:var(--ink);font:700 22px Tajawal;text-align:center}#fl .k{flex:1;height:56px;font-size:20px}
#msg{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 188px);display:none;background:#3a2a10;border:1px solid var(--gold);padding:12px;border-radius:12px;font-size:21px;line-height:1.6}
.lb{position:absolute;transform:translate(-50%,-50%);background:rgba(16,21,31,.92);border:2px solid var(--gold);padding:4px 11px;border-radius:8px;font:800 23px Tajawal;white-space:nowrap}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center}
#intro h1{font:700 58px Amiri,serif;margin:0;color:var(--gold)}#intro p{max-width:340px;line-height:1.9;margin:0;color:#c4ccd8;font-size:20px}
#go{padding:18px 50px;border:0;border-radius:36px;background:var(--gold);color:#241a05;font:800 26px Tajawal}
#intro a{color:var(--gold);font-size:20px}
</style>
</head>
<body>
<div id="intro"><h1>أبعاد</h1><div style="font:800 24px Tajawal;color:#2a9d8f;margin-top:-8px">قياسات ثلاثية الأبعاد</div><p id="ip">قياس حقيقي ثلاثي الأبعاد بتقنية ARCore: يفهم الهاتف الغرفة فتُقاس الجدران والأرض والسقف بدقة بلا معايرة.</p><button id="go">ابدأ الواقع المعزز</button><a href="v6.html">النسخة العادية (للفيديو المسجّل)</a></div>
<div id="ui">
<div id="top"><button class="k" id="bu"><b>↩</b>تراجع</button><button class="k" id="bc"><b>🗑</b>مسح</button><button class="k" id="bv"><b>🎤</b>أمر صوتي</button><button class="k" id="br"><b>🔊</b>اقرأ</button></div>
<div id="hud"><div id="hk">وجّه نحو سطح حتى تظهر الحلقة</div><div><span id="hv">—</span><span id="hu"></span></div><div id="hs"></div></div>
<div id="fl"><span>ارتفاع هاتفك عن الأرض (م)</span><input id="fh" type="number" step="0.01" value="1.4"><button class="k" id="bf">📍 اضبط الأرض</button></div><div id="lbls"></div><div id="msg"></div>
<div id="modes"></div>
<div id="add"><button id="ba">＋ ضع نقطة هنا</button></div>
<div id="well"><button id="w1">أفلتّ الحجر</button><button id="w2">سمعت الصدى</button></div>
</div>
<script>
var $=function(i){return document.getElementById(i)},renderer,scene,camera,reticle,hitSrc=null,hitOn=false,pts=[],grp,prev,mode='dist',mute=0,t0=0,wres=null,lastHud='',MD=[['dist','📏','مسافة'],['height','↕','ارتفاع وعمق'],['area','⬡','مساحة'],['angle','∠','زاوية'],['corner','⌐','ركن ثلاثي'],['level','⚖','استواء'],['well','🕳','بئر']];
var floorMode=false,floorY=null,camPos=new THREE.Vector3(),fwd=new THREE.Vector3(),qq=new THREE.Quaternion();
function f2(x){return Number(x).toLocaleString('ar-EG',{maximumFractionDigits:x<10?2:1})}
function msg(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display='none'},6500)}
function speak(t){if(mute)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function sp1(x){return(Math.round(x*10)/10).toString().replace('.',' فاصل ')}
function ang(a,b){return Math.acos(Math.max(-1,Math.min(1,a.dot(b)/(a.length()*b.length()||1))))*180/Math.PI}
function res(){var n=pts.length,P=pts,i;if(wres&&mode==='well')return wres;
if(mode==='dist'&&n>1){var t=0;for(i=1;i<n;i++)t+=P[i].distanceTo(P[i-1]);return{k:'المسافة (المجموع)',v:t,u:'م',sub:'آخر ضلع '+f2(P[n-1].distanceTo(P[n-2]))+' م'}}
if(mode==='height'&&n>1){var dy=P[n-1].y-P[n-2].y;return{k:'فرق الارتفاع أو العمق',v:Math.abs(dy),u:'م',sub:'النقطة '+f2(dy>0?n:n-1)+' هي الأعلى'}}
if(mode==='area'&&n>2){var s=new THREE.Vector3(),pr=0;for(i=0;i<n;i++){s.add(new THREE.Vector3().crossVectors(P[i],P[(i+1)%n]));pr+=P[i].distanceTo(P[(i+1)%n])}return{k:'المساحة',v:s.length()/2,u:'م²',sub:'المحيط '+f2(pr)+' م'}}
if(mode==='angle'&&n>2){var b=P[n-2];return{k:'الزاوية عند النقطة '+f2(n-1),v:ang(P[n-3].clone().sub(b),P[n-1].clone().sub(b)),u:'درجة'}}
if(mode==='corner'&&n>3){var V=P[n-4],A=P[n-3].clone().sub(V),B=P[n-2].clone().sub(V),C=P[n-1].clone().sub(V);return{k:'زاوية الركن (س–ص)',v:ang(A,B),u:'درجة',sub:'ص–ع '+f2(ang(B,C))+'° · س–ع '+f2(ang(A,C))+'°'}}
if(mode==='level'&&n>1){var ys=P.map(function(p){return p.y}),r=Math.max.apply(0,ys)-Math.min.apply(0,ys),a=P[n-2],b2=P[n-1],h=Math.hypot(b2.x-a.x,b2.z-a.z);return{k:r<.002?'✓ مستوٍ (ضمن ٢ مم)':'فرق الاستواء بين النقاط',v:r*1000,u:'مم',sub:'ميل آخر ضلع '+f2(Math.atan2(Math.abs(b2.y-a.y),h)*180/Math.PI)+'°'}}
return null}
function seg(a,b,c){var m=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,1,6),new THREE.MeshBasicMaterial({color:c}));setSeg(m,a,b);return m}
function setSeg(m,a,b){var d=b.clone().sub(a),l=d.length()||1e-4;m.position.copy(a).addScaledVector(d,.5);m.scale.set(1,l,1);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize())}
function rebuild(){while(grp.children.length)grp.remove(grp.children[0]);var n=pts.length,i;
pts.forEach(function(p){var s=new THREE.Mesh(new THREE.SphereGeometry(.014,12,12),new THREE.MeshBasicMaterial({color:0xd8b45c}));s.position.copy(p);grp.add(s)});
if(mode==='corner'&&n>3){var V=pts[n-4];[0xe5483d,0x2ecc71,0x4aa3ff].forEach(function(c,k){grp.add(seg(V,pts[n-3+k],c))})}
else{for(i=1;i<n;i++)grp.add(seg(pts[i-1],pts[i],0xd8b45c));if(mode==='area'&&n>2)grp.add(seg(pts[n-1],pts[0],0xd8b45c))}}
function add(){if(mode==='well')return;if(!hitOn){msg('وجّه الكاميرا نحو سطح وحرّكها ببطء حتى تظهر الحلقة البيضاء.');return}
pts.push(new THREE.Vector3().setFromMatrixPosition(reticle.matrix));rebuild();var r=res();if(r)speak(r.k+' '+sp1(r.v)+' '+r.u);else speak('النقطة '+pts.length)}
function undo(){pts.pop();rebuild()}function clr(){pts=[];wres=null;rebuild();msg('تم المسح.')}
function setMode(m){mode=m;wres=null;[].forEach.call($('modes').children,function(b){b.classList.toggle('on',b.dataset.m===m)});$('add').style.display=m==='well'?'none':'flex';$('well').style.display=m==='well'?'flex':'none';rebuild();
msg({dist:'ضع نقاطاً متتالية، فيظهر طول كل ضلع والمجموع.',height:'ضع نقطتين: الأولى والثانية على سطحين مختلفين لفرق الارتفاع، أو حافة الحفرة وقاعها للعمق.',area:'ضع نقاط حدود الشكل بالترتيب (٣ فأكثر).',angle:'ضع ٣ نقاط: الوسطى هي رأس الزاوية.',corner:'ضع رأس الركن أولاً، ثم نقطة على كل من الأضلاع الثلاثة (س ص ع). تظهر الزوايا الثلاث.',level:'ضع نقاطاً على السطح المراد فحصه: يظهر فرق الارتفاع بين أعلاها وأدناها.',well:'قف عند حافة البئر، اضغط «أفلتّ» مع إفلات الحجر ثم «سمعت الصدى».'}[m])}
$('modes').innerHTML=MD.map(function(m){return'<button class="k" data-m="'+m[0]+'"><b>'+m[1]+'</b>'+m[2]+'</button>'}).join('');
[].forEach.call($('modes').children,function(b){b.onclick=function(){setMode(b.dataset.m)}});
$('ba').onclick=add;$('bu').onclick=undo;$('bc').onclick=clr;
$('br').onclick=say;function say(){var r=res();if(r)speak(r.k+' '+sp1(r.v)+' '+r.u+(r.sub?'. '+r.sub:''));else msg('لا توجد نتيجة بعد.')}
$('w1').onclick=function(){t0=performance.now();wres=null;msg('أفلتَّ… انتظر الصدى.')};
$('w2').onclick=function(){if(!t0)return;var t=(performance.now()-t0)/1000,k=Math.sqrt(2/9.81),s=(-k+Math.sqrt(k*k+4*t/340))/(2/340);t0=0;wres={k:'عمق البئر',v:s*s,u:'م',sub:'زمن السقوط '+t.toFixed(2)+' ث'};speak('عمق البئر '+sp1(s*s)+' متر')};
$('bv').onclick=function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){msg('التعرّف الصوتي غير مدعوم هنا.');return}var r=new SR();r.lang='ar-SA';r.onresult=function(e){cmd(e.results[0][0].transcript)};r.onerror=function(){msg('لم أسمعك، أعد المحاولة.')};r.start();msg('🎤 قل: نقطة · مسافة · مساحة · زاوية · ركن · اقرأ · تراجع · امسح')};
function cmd(t){msg('سمعتُ: '+t);if(/نقط|ثبت|ضع|سجل/.test(t))return add();if(/مسح|امسح|احذف/.test(t))return clr();if(/تراجع/.test(t))return undo();if(/اقرأ|النتيج|كم|القيم/.test(t))return say();
var M=[[/ركن|ثلاث/,'corner'],[/زاوية|زاويه/,'angle'],[/مسافة|مسافه|طول/,'dist'],[/ارتفاع|عمق|فرق/,'height'],[/مساحة|مساحه/,'area'],[/استواء|مستوى|ميل/,'level'],[/بئر/,'well']];for(var i=0;i<M.length;i++)if(M[i][0].test(t))return setMode(M[i][1])}
/* AR */
function init(){renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.domElement.style.cssText='position:fixed;inset:0';document.body.appendChild(renderer.domElement);
scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,30);grp=new THREE.Group();scene.add(grp);
reticle=new THREE.Mesh(new THREE.RingGeometry(.035,.05,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
prev=new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,1,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7}));prev.visible=false;scene.add(prev)}
function L(el,p,t){var v=p.clone().project(window.cam0);if(v.z>1||v.z<-1)return;el.style.left=(v.x*.5+.5)*innerWidth+'px';el.style.top=(-v.y*.5+.5)*innerHeight+'px';el.textContent=t;el.style.display='block'}
var pool=[];function lab(i){if(!pool[i]){var d=document.createElement('div');d.className='lb';$('lbls').appendChild(d);pool[i]=d}return pool[i]}
function loop(t,frame){var n=pts.length;
if(frame){var rs=renderer.xr.getReferenceSpace();
if(floorMode){hitOn=false;reticle.visible=false;var vp=frame.getViewerPose(rs);if(vp){var pp=vp.transform.position,oo=vp.transform.orientation;camPos.set(pp.x,pp.y,pp.z);fwd.set(0,0,-1).applyQuaternion(qq.set(oo.x,oo.y,oo.z,oo.w));if(floorY!==null&&fwd.y<-.02){var tt=(floorY-camPos.y)/fwd.y;reticle.matrix.makeTranslation(camPos.x+fwd.x*tt,floorY,camPos.z+fwd.z*tt);reticle.visible=true;hitOn=true}}}
else{var hs=hitSrc?frame.getHitTestResults(hitSrc):[];if(hs.length){var po=hs[0].getPose(rs);if(po){reticle.visible=true;hitOn=true;reticle.matrix.fromArray(po.transform.matrix)}}else{reticle.visible=false;hitOn=false}}}
var rp=hitOn?new THREE.Vector3().setFromMatrixPosition(reticle.matrix):null;
if(rp&&n&&mode!=='well'){prev.visible=true;setSeg(prev,pts[n-1],rp)}else prev.visible=false;
renderer.render(scene,camera);var xc=renderer.xr.getCamera(camera);window.cam0=xc.cameras&&xc.cameras[0]?xc.cameras[0]:xc;
var k=0,i;pool.forEach(function(d){d.style.display='none'});
if(window.cam0&&mode!=='well'){
if(rp&&n){var d=pts[n-1].distanceTo(rp),dy=rp.y-pts[n-1].y;L(lab(k++),pts[n-1].clone().lerp(rp,.5),mode==='height'||mode==='level'?'↕ '+f2(Math.abs(dy)*(mode==='level'?1000:1))+(mode==='level'?' مم':' م'):f2(d)+' م')}
if(mode==='dist'||mode==='area'||mode==='level')for(i=1;i<n;i++)L(lab(k++),pts[i-1].clone().lerp(pts[i],.5),mode==='level'?f2(Math.abs(pts[i].y-pts[i-1].y)*1000)+' مم':f2(pts[i].distanceTo(pts[i-1]))+' م');
if(mode==='area'&&n>2)L(lab(k++),pts[n-1].clone().lerp(pts[0],.5),f2(pts[n-1].distanceTo(pts[0]))+' م');
if(mode==='angle'&&n>2)L(lab(k++),pts[n-2],f2(ang(pts[n-3].clone().sub(pts[n-2]),pts[n-1].clone().sub(pts[n-2])))+'°');
if(mode==='corner'&&n>3){var V=pts[n-4],A=pts[n-3].clone().sub(V),B=pts[n-2].clone().sub(V),C=pts[n-1].clone().sub(V);L(lab(k++),V.clone().addScaledVector(A,.35).addScaledVector(B,.35),f2(ang(A,B))+'°');L(lab(k++),V.clone().addScaledVector(B,.35).addScaledVector(C,.35),f2(ang(B,C))+'°');L(lab(k++),V.clone().addScaledVector(A,.35).addScaledVector(C,.35),f2(ang(A,C))+'°')}}
var r=res(),h=r?r.k+f2(r.v)+r.u+(r.sub||''):'';if(h!==lastHud){lastHud=h;$('hk').textContent=r?r.k:(hitOn?'اضغط «＋ ضع نقطة هنا»':(floorMode&&floorY===null?'اضبط الأرض أولاً (الزر أدناه)':'وجّه نحو سطح وحرّك ببطء'));$('hv').textContent=r?f2(r.v):'—';$('hu').textContent=r?r.u:'';$('hs').textContent=r&&r.sub?r.sub:''}}
$('go').onclick=async function(){try{if(!renderer)init();var s=null,tr=[['hit-test'],[]],i;
for(i=0;i<2&&!s;i++){try{s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:tr[i],optionalFeatures:['dom-overlay','hit-test'],domOverlay:{root:$('ui')}})}catch(e){if(i===1)throw e}}
renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(s);hitSrc=null;try{var vs=await s.requestReferenceSpace('viewer');hitSrc=await s.requestHitTestSource({space:vs})}catch(e){hitSrc=null}
floorMode=!hitSrc;$('fl').style.display=floorMode?'flex':'none';document.body.classList.add('ar');setMode('dist');
if(floorMode)msg('هاتفك لا يكشف الأسطح، فالقياس على الأرض فقط: قف، اكتب ارتفاع هاتفك عن الأرض، واضغط «اضبط الأرض».');else speak('وجّه الكاميرا نحو الأرض وحرّك الهاتف ببطء');
s.addEventListener('end',function(){document.body.classList.remove('ar');renderer.setAnimationLoop(null);hitSrc=null});renderer.setAnimationLoop(loop)}catch(e){$('ip').textContent='تعذّر تشغيل الواقع المعزز: '+(e&&e.message||e)+'. غالباً خدمة ARCore غير مثبّتة أو غير مدعومة في هاتفك.'}};
$('bf').onclick=function(){var h=parseFloat($('fh').value);if(!(h>0)){msg('اكتب ارتفاع هاتفك عن الأرض.');return}floorY=camPos.y-h;msg('تم ضبط الأرض. وجّه نحو الأرض لتظهر الحلقة.');speak('تم ضبط الأرض')};
if(!navigator.xr)$('ip').textContent='هذا المتصفح لا يدعم الواقع المعزز. استخدم Chrome على أندرويد، أو النسخة العادية.';
else navigator.xr.isSessionSupported('immersive-ar').then(function(ok){if(!ok)$('ip').textContent='هاتفك أو متصفحك لا يدعم الواقع المعزز (ARCore). استخدم النسخة العادية أدناه.'}).catch(function(){});
</script>
</body>
